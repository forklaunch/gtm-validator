id = "ee23c774-6258-4f85-8c12-af849f52dab0"
cli_version = "1.4.0"
app_name = "gtm-validator"
modules_path = "src/modules"
app_description = "GTM validator: startup idea analysis with real-world signals, adversarial review, and ForkLaunch build blueprints"
linter = "oxlint"
formatter = "biome"
validator = "zod"
http_framework = "express"
runtime = "node"
test_framework = "vitest"
author = "Rohin Bhargava"
license = "MIT"
platform_application_id = "f0c5a39b-8023-4936-afc9-41499c7285ab"
platform_organization_id = "0dc69b58-4d61-4845-9f76-19710c36a8f9"

[[projects]]
type = "Library"
name = "core"
description = "Core library for gtm-validator, containing shared foundational infrastrucuture and utilities"

[[projects]]
type = "Library"
name = "monitoring"
description = "Monitoring library for gtm-validator, defining metrics, logs, and trace building blocks"

[[projects]]
type = "Library"
name = "client-sdk"
description = "Client SDK for gtm-validator, containing shared foundational infrastrucuture and utilities"

[[projects]]
type = "Service"
name = "analysis"
description = "Startup idea GTM analysis, real-world signals, adversarial review, and build blueprints"
routers = ["analysis"]

[projects.resources]
database = "postgresql"

[project_peer_topology]
gtm-validator = [
    "core",
    "monitoring",
    "client-sdk",
    "analysis",
]
